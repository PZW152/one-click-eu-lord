name: Release

# Pushing a tag like v1.2.3 tests that exact commit on Windows, builds the
# single-file EU-Overlord.cmd and publishes (or refreshes) the GitHub Release.
# The asset name never changes, so this link always serves the newest version:
#   https://github.com/PZW152/one-click-eu-overlord/releases/latest/download/EU-Overlord.cmd
# Can also be run by hand against an existing tag (v1.2.0 or later).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag (v1.2.0 or later) to rebuild the release asset for'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Passed via env (never interpolated into scripts) to avoid injection.
  RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write   # create the release and upload its asset
    steps:
      - name: Validate tag
        shell: pwsh
        run: |
          if ($env:RAW_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Refusing tag '$env:RAW_TAG': must look like v1.2.3" }
          "TAG=$env:RAW_TAG" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # actions/checkout v4.3.0, pinned to a full commit SHA.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      # The tests also build EU-Overlord.cmd in a sandbox and run it end to end.
      - name: Tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\Test-Engine.ps1

      - name: Tests (PowerShell 7)
        shell: pwsh
        run: .\tests\Test-Engine.ps1

      - name: Engine version matches the tag
        shell: pwsh
        run: |
          $m = [regex]::Match((Get-Content src\EUOverlord.ps1 -Raw), '\$Script:Version\s*=\s*''(\d+\.\d+\.\d+)''')
          if (-not $m.Success) { throw 'No $Script:Version found in src\EUOverlord.ps1' }
          if ("v$($m.Groups[1].Value)" -ne $env:TAG) { throw "Engine says v$($m.Groups[1].Value) but the tag is $env:TAG" }

      - name: Build EU-Overlord.cmd
        shell: pwsh
        run: .\tools\Build-SingleFile.ps1 -OutFile dist\EU-Overlord.cmd

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          # The section under "## vX.Y.Z", up to the next "## " heading.
          awk -v tag="$TAG" '
            $0 ~ "^## " tag "([^0-9.]|$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $TAG" >&2
            exit 1
          fi
          cat notes.md

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing its asset."
            gh release upload "$TAG" dist/EU-Overlord.cmd --clobber
          else
            gh release create "$TAG" dist/EU-Overlord.cmd \
              --verify-tag \
              --title "$TAG — 一鍵轉生歐盟爺 · 一键转生欧盟爷 · One-Click EU Overlord" \
              --notes-file notes.md
          fi
