name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked --bin eulord
      - name: Portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target\release\eulord.exe dist\EULord.exe
          $hash = Get-FileHash dist\EULord.exe -Algorithm SHA256
          Set-Content dist\EULord.exe.sha256 "$($hash.Hash.ToLower())  EULord.exe" -Encoding ascii
          Compress-Archive -Path dist\EULord.exe,dist\EULord.exe.sha256 -DestinationPath dist\EULord-portable.zip -Force
      - name: MSIX package and sign
        if: env.MSIX_PFX_BASE64 != ''
        shell: pwsh
        env:
          MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$pwd\signing.pfx", [Convert]::FromBase64String($env:MSIX_PFX_BASE64))
          ./tools/Pack-Msix.ps1 -PfxPath "$pwd\signing.pfx" -PfxPassword $env:MSIX_PFX_PASSWORD
          Remove-Item "$pwd\signing.pfx" -Force
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/EULord.exe
            dist/EULord.exe.sha256
            dist/EULord-portable.zip
            dist/OneClickEULord.msix
            dist/OneClickEULord.appinstaller
